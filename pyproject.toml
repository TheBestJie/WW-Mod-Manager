[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ww-mod-manager"
version = "1.3.0"
description = "Wuthering Waves XXMI/WWMI mod manager TUI for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.0,<9",
  "platformdirs>=4,<5",
  "tomli-w>=1,<2",
  "pypinyin>=0.53,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyyaml>=6",
]

[project.scripts]
wwmm = "wwmm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wwmm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
