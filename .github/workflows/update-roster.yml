name: Update character roster

on:
  schedule:
    - cron: "0 19 * * *"   # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-character-roster
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Generate roster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_roster.py --out data/roster.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/roster.json; then
            echo "No roster changes."
            exit 0
          fi
          VERSION=$(python -c 'import json; print(json.load(open("data/roster.json"))["game_version"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster.json
          git commit -m "chore(roster): sync ${VERSION}"
          git push
